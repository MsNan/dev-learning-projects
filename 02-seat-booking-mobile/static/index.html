<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>座位预约 · 学习示例</title>
<style>body{margin:0;font:15px/1.5 -apple-system,"PingFang SC",sans-serif;background:#f2f4f7;color:#222;max-width:480px;margin:0 auto}
.hd{background:linear-gradient(135deg,#10b981,#059669);color:#fff;padding:18px 16px 26px}.hd h1{margin:0;font-size:20px}.box{background:#fff;margin:12px;border-radius:12px;padding:14px}
.chips{display:flex;gap:8px;overflow-x:auto}.chip{padding:6px 12px;border-radius:16px;background:#f1f5f9;white-space:nowrap;cursor:pointer}.chip.on{background:#059669;color:#fff}
.grid{display:grid;gap:6px;margin-top:10px}.seat{aspect-ratio:1;border-radius:6px;background:#d1fae5;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;position:relative}
.seat.t{background:#e5e7eb;color:#9ca3af;cursor:not-allowed}.seat.sel{background:#059669;color:#fff}.legend{font-size:12px;color:#666;margin-top:8px}
.btn{display:block;width:100%;background:#059669;color:#fff;border:0;border-radius:22px;padding:12px;font-size:16px;margin-top:12px}.tab{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;display:flex;background:#fff;border-top:1px solid #eee}.tab a{flex:1;text-align:center;padding:10px;color:#666;cursor:pointer}.tab a.on{color:#059669;font-weight:700}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f1f1}.item small{color:#888}.sm{border:1px solid #ddd;background:#fff;border-radius:14px;padding:3px 10px;margin-left:4px}
input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:8px;margin-bottom:10px}.dl-fab{bottom:64px!important}</style></head>
<body><div class="hd"><h1>🪑 图书馆座位预约 <span data-edition></span></h1><div id="sub" style="opacity:.9;font-size:13px">选座 · 预约 · 签到</div></div><div id="v"></div><div class="tab" id="tab"></div>
<script src="/common/common.js"></script><script src="app.js"></script></body></html>
