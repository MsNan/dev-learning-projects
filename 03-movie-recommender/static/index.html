<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电影推荐与可视化 · 学习示例</title>
<style>body{margin:0;font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f172a;color:#e2e8f0}header{padding:14px 24px;display:flex;gap:18px;align-items:center;background:#111827;border-bottom:1px solid #1f2937}header b{font-size:18px;color:#f472b6}header a{color:#94a3b8;cursor:pointer}header a.on{color:#fff;font-weight:700}
main{max-width:1150px;margin:18px auto;padding:0 16px}.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.mv{background:#1e293b;border-radius:10px;padding:12px}.mv .t{font-weight:700;color:#fff}.mv small{color:#94a3b8}
.poster{height:90px;border-radius:6px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;font-size:30px}.stars span{cursor:pointer;color:#475569;font-size:18px}.stars span.on{color:#fbbf24}
h3{color:#f9a8d4;margin:22px 0 10px}.panel{background:#1e293b;border-radius:10px;padding:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.bar{display:flex;align-items:center;gap:8px;margin:5px 0}.bar i{display:block;height:14px;background:linear-gradient(90deg,#ec4899,#8b5cf6);border-radius:7px}
.login{max-width:320px;margin:10vh auto;background:#1e293b;padding:26px;border-radius:12px}.login input{width:100%;box-sizing:border-box;margin-bottom:10px;padding:9px;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#fff}
button{background:#ec4899;color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}.chips span{display:inline-block;padding:3px 10px;border-radius:12px;background:#1e293b;margin:0 6px 6px 0;cursor:pointer}.chips span.on{background:#ec4899}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.kpi div{background:#1e293b;border-radius:10px;padding:14px}.kpi b{display:block;font-size:24px;color:#f472b6}.pro-lock{color:#92400e}.dl-note{color:#64748b}</style></head>
<body><header><b>🎬 电影推荐 & 可视化</b><span data-edition></span><nav id="nav"></nav></header><main id="v"></main>
<script src="/common/common.js"></script><script src="app.js"></script></body></html>
