<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图书管理系统 · 学习示例</title>
<style>body{margin:0;font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6f9;color:#222}header{background:#2563eb;color:#fff;padding:12px 24px;display:flex;align-items:center;gap:16px}header b{font-size:18px}header nav a{color:#dbeafe;margin-right:14px;cursor:pointer}header nav a.on{color:#fff;font-weight:700}
main{max-width:1100px;margin:20px auto;padding:0 16px}table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden}th,td{padding:8px 10px;border-bottom:1px solid #eee;text-align:left}th{background:#f8fafc}
button{border:1px solid #cbd5e1;background:#fff;border-radius:5px;padding:4px 10px;cursor:pointer;margin-right:4px}button.p{background:#2563eb;color:#fff;border-color:#2563eb}input,select{padding:6px 8px;border:1px solid #cbd5e1;border-radius:5px}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.card{background:#fff;border-radius:8px;padding:14px}.card .v{font-size:24px;font-weight:700;color:#2563eb}
.login{max-width:340px;margin:10vh auto;background:#fff;padding:28px;border-radius:10px}.login input{width:100%;box-sizing:border-box;margin-bottom:10px;padding:9px}.red{color:#dc2626}.right{margin-left:auto}</style></head>
<body><header><b>📚 图书管理系统</b><span data-edition></span><nav id="nav"></nav><span class="right" id="who"></span></header><main id="v"></main>
<script src="/common/common.js"></script><script src="app.js"></script></body></html>
